{% extends "admin/change_form.html" %}
{% block submit_buttons_bottom %}

{% if template_message %}
<fieldset>
    <div class="inline-heading">Template</div>
</fieldset>
<pre id="rendered-template-subject"
    style="font-size: 16px; font-family: Arial, Helvetica, sans-serif">{{template_subject}}</pre>
<pre id="rendered-template-message"
    style="font-size: 16px; font-family: Arial, Helvetica, sans-serif">{{template_message}}</pre>
<div class="submit-row">
    <input class="copy-message" id="copy-template-subject" type="button" value="Copy subject">
    <input class="copy-message" id="copy-template-message" type="button" value="Copy message">
</div>
{% endif %}

{{ block.super }}
{% endblock %}
