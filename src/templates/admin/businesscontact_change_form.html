{% extends "admin/change_form.html" %}

{% block submit_buttons_bottom %}

{% if template_message %}
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<div id="app">
    <fieldset>
        <div class="inline-heading">Template</div>
    </fieldset>
    <div class="email-template">
        <p id="rendered-template-subject">{{template_subject}}</p>
        <div id="rendered-template-message">
            {{template_message}}
        </div>
    </div>
    <div class="submit-row">
        <input class="copy-message" id="copy-template-subject" type="button" value="Copy subject">
        <input class="copy-message" id="copy-template-message" type="button" value="Copy message">
        <select class="copy-message" id="selected_email" name="selected_email">
            <option value="">No e-mail selected</option>
            {% for email in business.emails.all %}
            <option value="{{email.id}}">{{email.address}}</option>
            {% endfor %}
        </select>
        <select class="copy-message" id="selected_member" name="selected_member" v-model="selected_member">
            <option value="">No member selected</option>
            {% for member in business.staff_members.all %}
            <option value="{{member.get_first_name}}" :key="{{member.pk}}">{{member.name.title}}</option>
            {% endfor %}
        </select>
        <input class="copy-message" id="send-email" type="button" value="Send e-mail">
        <input class="copy-message" id="copy-email-interaction-data" type="button" value="Copy interaction">
    </div>
</div>

<script>
    const { createApp } = Vue

    const app = createApp({
        data() {
            return {
                selected_member: "",
            }
        },
    })
    app.config.compilerOptions.delimiters = ['[[', ']]']
    app.mount('#app')
</script>
{% endif %}

{{ block.super }}
{% endblock %}
